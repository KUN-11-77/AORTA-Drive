name: Bug report
description: Report a reproducible implementation defect.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Defect
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, configuration, and smallest input that reproduces it.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Git commit hash used for the reproduction.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, accelerator, and relevant package versions.
    validations:
      required: true

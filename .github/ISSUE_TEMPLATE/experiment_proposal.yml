name: Experiment proposal
description: Propose a claim-linked experiment before compute is used.
title: "[Experiment] "
labels: [experiment]
body:
  - type: input
    id: claim
    attributes:
      label: Claim ID
      description: Claim from docs/CLAIM_EVIDENCE_MATRIX.md.
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis and rival explanation
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Controlled design
      description: Data split, controls, interventions, seeds, and compute budget.
    validations:
      required: true
  - type: textarea
    id: endpoint
    attributes:
      label: Primary endpoint and success criterion
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Falsifier and stop condition
    validations:
      required: true

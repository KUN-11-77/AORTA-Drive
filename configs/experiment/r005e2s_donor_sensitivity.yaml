  experiment: R005E2B
  implementation_commit: 0fdee4b464865d76f2efbc62955baa7e8f7ca8f5
  decision: STOP_CURRENT_VISUAL_MAIN_CLAIM
  decision_is_immutable: true
  retraining: prohibited

inputs:
  source_groups: 42
  anchors: 672
  outer_folds: 6
  seeds: [20261025, 20261026, 20261027]
  schemes: [S2_disjoint_geometry, S3_hash_random]

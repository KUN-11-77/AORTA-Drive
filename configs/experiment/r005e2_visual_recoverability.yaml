arms:
  V0_removed:
    scene_visual: outer_train_slot_mean_token
    interpretation: parameter_matched_trajectory_history_control
  V1_mismatch:
    scene_visual: geometry_matched_other_group_DINO
    donor_from_outer_test: prohibited
    donor_same_group: prohibited
    labels_or_DINO_content_used_for_matching: false
    descriptor: native_realized_geometry_and_legal_domain_cardinality_v1
    matching: global_linear_sum_assignment_without_replacement
    selection_fit_donor_pool: inner_fit
    selection_validation_donor_pool: inner_fit
    refit_train_donor_pool: outer_train
    outer_test_donor_pool: outer_train
    training_donor_visual_marginal: exact_permutation
  V2_correct:
    scene_visual: recipient_DINO
  exact_architecture_parameter_token_and_optimizer_match: true
  measured_forward_FLOPs_max_ratio: 1.01

probe:
  name: matched_full_context_set_scorer_v1
  candidate_input: ego_frame_SE2_41_samples
  previous_input: causal_native_previous_SE2_41_samples
  visual_input_shape: [12, 18, 32, 1280]
  visual_token_count: 6912
  visual_positional_context: camera_plus_history_plus_2D_patch_coordinates
  hidden_dimension: 256
  attention_heads: 8
  candidate_history_layers: 2
  permutation_equivariant_set_layers: 2
  visual_cross_attention_layers: 1
  dropout: 0.1
  output: tanh_native_relative_margin
  native_margin: 0.0
  differential_support_query: prohibited
  orbit_loss: prohibited
  uncertainty_or_calibration: prohibited

training:
  loss: equal_group_anchor_challenger_squared_margin_error
  optimizer: AdamW
  base_learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_fraction: 0.05
  schedule: cosine_after_linear_warmup
  maximum_epochs: 40
  early_stop_patience: 5
  early_stop_metric: inner_validation_equal_group_relation_MSE
  seeds: [20261025, 20261026, 20261027]
  model_family_or_loss_search: prohibited
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  mixed_precision: bfloat16
  flash_or_memory_efficient_SDPA: disabled_for_replay

appearance_conditions:
  primary: [clean]
  frozen_secondary: [low_exposure, low_contrast, cool_cast]
  source: R004H5_frozen_operators
  semantics: geometry_preserving_controlled_photometric_stress_only

primary_endpoints:
  metrics:
    - equal_group_relation_MSE
    - equal_group_decision_regret
    - pair_sign_and_boundary_error
    - oracle_normalized_visual_recovery
    - correct_checkpoint_mismatch_and_removed_intervention_regret
  oracle_gain_denominator: 0.01665036604823182

statistics:
  aggregate_seeds_within_group_first: true
  bootstrap_unit: recording_group
  bootstrap_seed: 20261025
  bootstrap_replicates: 10000
  confidence_interval: 0.95
  anchor_as_independent_sample: prohibited
  conjunctive_intersection_union_gate: true

decision:
  go_requires:
    - all_provenance_fold_donor_membership_label_replay_and_audit_gates_pass
    - V2_minus_V0_relation_MSE_CI95_upper_strictly_below_zero
    - V2_minus_V1_relation_MSE_CI95_upper_strictly_below_zero
    - V2_minus_V0_regret_CI95_upper_strictly_below_zero
    - V2_minus_V1_regret_CI95_upper_strictly_below_zero
    - V2_mismatch_intervention_minus_correct_regret_CI95_lower_strictly_above_zero
    - V2_removed_intervention_minus_correct_regret_CI95_lower_strictly_above_zero
    - oracle_normalized_visual_recovery_point_at_least_0p10
  mixed_if:
    - proper_risk_passes_but_regret_or_scene_specificity_fails
  stop_if:
    - correct_visual_fails_to_outperform_both_trained_controls
  invalid_if:
    - any_split_donor_source_cache_label_replay_or_finite_gate_fails
  go_unlocks: matched_generic_vs_differential_query_preregistration_only


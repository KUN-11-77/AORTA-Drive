  nested_units: [anchor, candidate, grid_phase, grid_resolution]
  prevalence_or_population_significance_claim: prohibited
  purpose: determine_geometry_interface_validity_not_method_performance

continuous_object:
  vehicle: exact_R004H4P5I_vehicle_rectangle
  trajectory: official_realized_0.1_second_states
  interpolation:
    translation: linear
    yaw: shortest_continuous_unwrapped_linear
  roi: exact_R004H4P5I_support
  clipping: reject
  empty_trajectory_or_set: reject

polygon_reference:
  role: independent_high_resolution_diagnostic_not_formal_ground_truth
  implementation: polygon_union_of_exact_pose_rectangles_on_dyadic_time_mesh
  temporal_subdivisions_per_official_interval: [1, 2, 4, 8, 16, 32]
  report:
    - challenger_minus_native_area_m2_at_every_level
    - native_minus_challenger_area_m2_at_every_level
    - last_two_level_absolute_change_m2
    - topology_or_numeric_failure
  interpretation:
    exact_true_area_claim: prohibited
    positive_existence_claim_requires_formal_cell_certificate: true

formal_certificates:
  historical_control:
    name: rotation_free_disk
    production_use: prohibited
  candidate:
    name: interval_safe_oriented_rectangle
    segment_outer_cover: midpoint_rectangle_plus_translation_yaw_and_pose_inflation
    inner_set: complete_cells_proved_inside_a_pose_error_shrunk_rectangle
    noninclusion: inner_cell_disjoint_from_every_opposing_segment_outer_cover
    arithmetic: exact_binary64_rationals_plus_directed_rounding
  geometry_resolutions_m: [1.0, 0.5, 0.25, 0.125]
  primary_grid_phase_fraction: [0.0, 0.0]
  diagnostic_grid_phase_fractions:
    - [0.0, 0.0]
    - [0.5, 0.0]
    - [0.0, 0.5]
    - [0.5, 0.5]
  phase_selection_after_results: prohibited
  primary_decision_uses_canonical_phase_only: true
  required_adversarial_cases:
    - identical_trajectories
    - known_lateral_translation
    - grid_phase_translation
    - yaw_only_change
    - translation_plus_yaw
    - roi_boundary_rejection
    - empty_input_rejection
    - temporal_refinement

implementation:
  legacy_geometry_source_sha256: 34c17da1f59c18d9b8810abcac7b86865f0d6d0c3c35184204fa57234146fbec
  predecessor_hash_difference_scope: additive_disk_resolution_barrier_only

required_outputs:
  - reference_area_and_convergence_per_candidate
  - disk_lower_bounds_as_retired_control
  - oriented_lower_bounds_by_resolution_and_phase
  - certificate_to_reference_area_ratio_when_denominator_positive
  - teacher_improvement_lower_bound_for_every_geometry_valid_candidate
  - wall_time_peak_memory_and_witness_count
  - complete_rejection_reason_ledger

qualification:
  soundness_pass_requires:
    - all_registered_synthetic_and_adversarial_cases_pass
    - every_positive_formal_witness_is_a_subset_proof_not_a_sampled_point_heuristic
    - no_roi_clipping_empty_set_fallback_or_nonfinite_value
    - polygon_reference_is_not_used_as_an_upper_bound_or_a_soundness_oracle
  nontriviality_pass_requires:
    - at_least_one_frozen_real_candidate_has_positive_formal_area_in_both_directions_at_canonical_0p25m_or_0p125m_resolution
  resolution_assessment:
    - report_all_frozen_resolutions_without_post_hoc_selection
    - positive_bounds_should_not_decrease_under_nested_canonical_refinement_except_for_a_declared_implementation_error
    - certificate_to_polygon_ratio_is_diagnostic_only_because_sampled_polygon_union_is_not_an_area_upper_bound
  teacher_outcome:
    - report_separately_from_geometry
    - geometry_pass_does_not_imply_teacher_opportunity

terminal_rules:
  - if_polygon_reference_is_positive_but_all_fine_grid_bounds_are_zero_stop_grid_refinement_and_evaluate_conservative_polygon_certification
  - if_no_polygon_reference_difference_exists_stop_geometry_and_review_candidate_provider
  - if_geometry_is_nontrivial_but_all_teacher_improvement_bounds_are_below_0p5m_stop_geometry_and_review_provider_or_task_margin
  - do_not_change_candidates_thresholds_sentinels_or_grid_phases_after_results
  - do_not_expand_to_128_anchors_unless_soundness_and_nontriviality_both_pass
  - this_is_the_last_geometry_representation_iteration_before_a_keep_or_retire_decision

resources:
  device: cpu
  maximum_wall_minutes: 30
  maximum_output_mib: 32


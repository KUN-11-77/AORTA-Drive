[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aorta-drive"
version = "0.1.0"
description = "Calibrated field envelopes for appearance-robust trajectory arbitration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
model = [
  "torch>=2.4,<3",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "scipy>=1.11,<2",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
]

[project.scripts]
aorta-drive = "aorta_drive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

